<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sehat Klinik — Sistem Reservasi</title>
<meta name="description" content="Sistem Informasi Reservasi Klinik Kesehatan" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='28' fill='%236f8bf7'/%3E%3Cpath d='M50 26c-5 0-9 4-9 9v4h-4c-5 0-9 4-9 9v18c0 5 4 9 9 9h26c5 0 9-4 9-9V48c0-5-4-9-9-9h-4v-4c0-5-4-9-9-9z' fill='white'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>

<!-- dekorasi latar lembut -->
<div class="backdrop" aria-hidden="true">
  <span class="blob blob-1"></span>
  <span class="blob blob-2"></span>
  <span class="blob blob-3"></span>
  <span class="blob blob-4"></span>
  <span class="grain"></span>
</div>

<div class="app-shell">

  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14v-2a5 5 0 0 0-5-5h-4a5 5 0 0 0-5 5v2"/>
          <circle cx="12" cy="7" r="3"/><path d="M12 12v8M8 16h8"/>
        </svg>
      </div>
      <div class="brand-text">
        <strong>Sehat Klinik</strong>
        <span>Sistem Reservasi</span>
      </div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Tutup menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="sidebar-foot">
      <div class="profile">
        <div class="avatar" id="profileAvatar">AD</div>
        <div class="profile-meta">
          <strong>Admin Klinik</strong>
          <span id="profileSub">Petugas Registrasi</span>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Ganti tema">
        <span class="theme-icon sun">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </span>
        <span class="theme-icon moon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </span>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </button>
    </div>
  </aside>

  <div class="sidebar-scrim" id="sidebarScrim"></div>

  <!-- ============ MAIN ============ -->
  <main class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="page-head">
        <h1 id="pageTitle">Dashboard</h1>
        <p id="pageSub">Ringkasan aktivitas klinik hari ini</p>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.2-3.2"/></svg>
        <input type="search" id="globalSearch" placeholder="Cari pasien, kode reservasi..." autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>

      <div class="topbar-actions">
        <div class="today-chip" id="todayChip"></div>
        <button class="btn btn-primary" id="btnNewReservasi">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Reservasi Baru</span>
        </button>
      </div>
    </header>

    <section class="view" id="view"></section>
  </main>
</div>

<div id="modalRoot"></div>
<div id="toastRoot" class="toast-root"></div>

<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/views/dashboard.js"></script>
<script src="assets/js/views/reservasi.js"></script>
<script src="assets/js/views/pasien.js"></script>
<script src="assets/js/views/dokter.js"></script>
<script src="assets/js/views/jadwal.js"></script>
<script src="assets/js/views/laporan.js"></script>
<script src="assets/js/views/pengaturan.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
